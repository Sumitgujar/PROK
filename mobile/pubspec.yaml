name: prok_mobile
description: PROK - AI-powered College Personal Guide (Mobile)
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # HTTP
  http: ^1.2.1
  # State management
  provider: ^6.1.2
  # Local storage
  shared_preferences: ^2.2.3
  # Navigation
  go_router: ^13.2.0
  # JSON
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
